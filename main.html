<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TikTok Shop Order Formatter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- App Header -->
        <div class="app-header">
            <div class="app-title">
                <div>
                    <h1>TikTok Shop Order Organizer</h1>

                    <p class="subtitle">
                        Convert your TikTok Seller CSV into a clean Google Sheets format.
                    </p>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="upload-section">
            <label class="file-input-zone" id="drop-zone">

                <h2 id="file-text">
                    Upload Your Order CSV
                </h2>

                <p class="upload-subtitle">
                    Drag & drop your CSV here or click to browse
                </p>

                <span class="upload-note">
                    CSV files only
                </span>

                <input type="file" id="csv-file" accept=".csv">
            </label>
        </div>

        <!-- Copy Button -->
        <div class="actions">

            <button class="btn" id="copy-btn" onclick="copyTableToClipboard()">
                Copy Data for Google Sheets
            </button>
        </div>

        <!-- Orders Section -->
        <div class="orders-section">
            <div class="orders-header">
                <div>
                    <h2>Orders</h2>
                    <p>Imported TikTok Shop order data.</p>
                </div>
            </div>

            <div class="table-container">
                <table id="output-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th>Variation (SKU)</th>
                        </tr>
                    </thead>

                    <tbody id="table-body">
                        <tr>
                            <td colspan="4" class="empty-state">
                                No data uploaded yet. Your formatted rows will appear here.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
